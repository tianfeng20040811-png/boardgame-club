# 备用唤醒：服务器自己每 5 分钟访问自己（见 server.js startKeepAlive），这里只是万一它重启后没被访问时把它叫醒。
# GitHub 的定时任务经常大幅延后（实测 7–9 小时才跑一次），所以只作辅助。访问 /healthz 不读写数据库。
# 注意：仓库连续 60 天没有提交时，GitHub 会自动停用定时任务，需要到 Actions 页面重新启用。
name: keep-alive
on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: ping healthz
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 200 https://kaizhuo-boardgame.onrender.com/healthz || true)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "::warning::healthz did not return 200"
