# 保持 Render 免费实例清醒：免费实例闲置 15 分钟就会休眠，再次打开要等 Render 重新分配机器（1–3 分钟）。
# 北京时间 7:00 到次日 1:00 之间每 5 分钟访问一次 /healthz（不读写数据库，不占 Neon 额度）。
# 每天约 18 小时 × 31 天 ≈ 560 小时，在 Render 免费额度（每月 750 小时）以内。
# 注意：仓库连续 60 天没有提交时，GitHub 会自动停用定时任务，需要到 Actions 页面重新启用。
name: keep-alive
on:
  schedule:
    - cron: "2-59/5 0-16,23 * * *" # UTC 23:00–16:59 = 北京时间 7:00–次日 0:59
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: ping healthz
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 200 https://kaizhuo-boardgame.onrender.com/healthz || true)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "::warning::healthz did not return 200"
