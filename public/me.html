<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>我的报名 · 开桌桌游社</title>
  <meta name="description" content="查看自己在桌游社的报名：每一轮分到哪一桌、和谁同桌；可以修改、取消，换了浏览器可以用找回码找回。">
  <meta name="theme-color" content="#04050d">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/assets/base.css?v=__V__">
  <link rel="stylesheet" href="/assets/site.css?v=__V__">
  <script src="/assets/core.js?v=__V__" defer></script>
  <script src="/assets/me.js?v=__V__" defer></script>
</head>
<body class="page-me">
  <div class="space space-static" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>

  <header class="topbar">
    <div class="wrap topbar-in">
      <a class="brand" href="/" aria-label="开桌 · 桌游社 首页">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="bm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22e5ff"/><stop offset="1" stop-color="#ff2bd6"/></linearGradient></defs><path d="M16 2l12 7v14l-12 7-12-7V9z" fill="none" stroke="url(#bm)" stroke-width="2.2" stroke-linejoin="round"/><circle cx="11.5" cy="12" r="2" fill="#22e5ff"/><circle cx="20.5" cy="20" r="2" fill="#ff2bd6"/><circle cx="16" cy="16" r="2" fill="#fff"/></svg>
        <span><span class="brand-name">开桌 · 桌游社</span><small>BOARD GAME CLUB</small></span>
      </a>
      <nav class="nav" aria-label="主导航">
        <a href="/" data-nav="/">首页</a>
        <a href="/games" data-nav="/games">游戏库</a>
        <a href="/me" data-nav="/me">我的</a>
        <a class="nav-cta" href="/signup" data-nav="/signup">报名</a>
        <a class="nav-admin" href="/admin" aria-label="管理后台" title="管理后台"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span>管理</span></a>
      </nav>
    </div>
  </header>

  <main id="main" class="wrap me-main">
    <section class="lib-hero">
      <p class="kicker">// MY SIGNUPS</p>
      <h1>我的报名</h1>
      <p>记录保存在<b>这个浏览器</b>里。每一轮分到哪一桌、和谁同桌都在这里；开局前可以修改或取消。</p>
    </section>

    <div id="mineList" class="me-list" aria-live="polite">
      <div class="skeleton" style="height:160px"></div>
    </div>

    <section class="panel me-teach" id="myTeach" hidden aria-live="polite"></section>

    <section class="panel me-recover" aria-labelledby="recoverTitle">
      <h2 id="recoverTitle">找回报名</h2>
      <p class="hint">换了浏览器（比如在微信里报的名、现在用 Chrome 打开）就看不到原来的记录。报名时设了 4 位找回码的，在这里输入就能找回到这个浏览器；没设的请联系组织者。</p>
      <form id="recoverForm" class="recover-form" method="post" action="/me" novalidate>
        <div class="field"><label class="label" for="rSession">场次</label><select class="select" id="rSession" required></select></div>
        <div class="field"><label class="label" for="rName">报名时的称呼</label><input class="input" id="rName" maxlength="20" autocomplete="nickname" required></div>
        <div class="field"><label class="label" for="rPin">找回码</label><input class="input mono" id="rPin" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="4 位数字" required></div>
        <button class="btn btn-primary" type="submit" id="rBtn">找回</button>
      </form>
      <p class="err" id="rErr" role="alert"></p>
    </section>
    <div style="height:48px"></div>
  </main>

  <footer class="footer">
    <div class="wrap footer-in">
      <span>© 2026 开桌 · 桌游社 · 每周五 18:30 · R312</span>
      <span><a href="/">首页</a> · <a href="/signup">报名</a> · <a href="/games">游戏库</a></span>
    </div>
  </footer>
</body>
</html>
