<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>管理后台 · 开桌桌游社</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#04050d">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/base.css?v=__V__">
  <link rel="stylesheet" href="/assets/admin.css?v=__V__">
  <script src="/assets/core.js?v=__V__" defer></script>
  <script src="/assets/admin.js?v=__V__" defer></script>
</head>
<body class="page-admin">
  <header class="topbar">
    <div class="wrap topbar-in">
      <a class="brand" href="/" aria-label="返回首页">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2l12 7v14l-12 7-12-7V9z" fill="none" stroke="#22e5ff" stroke-width="2.2" stroke-linejoin="round"/><circle cx="16" cy="16" r="2.4" fill="#ff2bd6"/></svg>
        <span><span class="brand-name">开桌 · 管理后台</span><small>ADMIN CONSOLE</small></span>
      </a>
      <nav class="nav" aria-label="后台导航">
        <span class="chip" id="whoami" hidden></span>
        <a href="/" target="_blank" rel="noopener">看主页 ↗</a>
        <button class="btn btn-sm btn-ghost" id="logout" type="button" hidden>退出</button>
      </nav>
    </div>
  </header>

  <main id="main" class="wrap admin-main">
    <section id="login" class="login panel" hidden>
      <h1>管理员登录</h1>
      <p class="hint">所有者用 Render 环境变量里的 <code>ADMIN_KEY</code>；协作管理员用所有者发给你的专属密钥。密钥只保存在本次浏览器会话中，关闭标签页后需重新输入。</p>
      <form id="loginForm" class="login-form">
        <label class="label" for="key">管理员密钥</label>
        <input class="input" id="key" type="password" autocomplete="current-password" required>
        <p class="err" id="loginErr" role="alert"></p>
        <button class="btn btn-primary btn-block" type="submit">进入后台</button>
      </form>
    </section>

    <section id="app" hidden>
      <div id="storageWarn" class="warn" hidden></div>
      <div class="tabs" role="tablist" aria-label="后台功能">
        <button role="tab" type="button" data-tab="list" aria-selected="true">报名名单</button>
        <button role="tab" type="button" data-tab="tables" aria-selected="false">分桌 / 签到</button>
        <button role="tab" type="button" data-tab="sessions" aria-selected="false">场次</button>
        <button role="tab" type="button" data-tab="games" aria-selected="false">桌游</button>
        <button role="tab" type="button" data-tab="data" aria-selected="false">数据与设置</button>
      </div>

      <div class="session-pick" id="sessionPickRow">
        <label class="label" for="sessionPick">场次</label>
        <select class="select" id="sessionPick"></select>
        <button class="btn btn-sm" type="button" id="refreshBtn">刷新</button>
      </div>

      <div class="tab-panel" id="tab-list"></div>
      <div class="tab-panel" id="tab-tables" hidden></div>
      <div class="tab-panel" id="tab-sessions" hidden></div>
      <div class="tab-panel" id="tab-games" hidden></div>
      <div class="tab-panel" id="tab-data" hidden></div>
    </section>
  </main>
</body>
</html>
