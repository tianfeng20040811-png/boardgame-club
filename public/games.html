<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>游戏库 · 开桌桌游社</title>
  <meta name="description" content="桌游社可玩游戏一览：游戏介绍、规则速览与 B 站教学视频，按人数、时长、难度筛选。">
  <meta name="theme-color" content="#04050d">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/assets/base.css?v=__V__">
  <link rel="stylesheet" href="/assets/site.css?v=__V__">
  <script src="/assets/core.js?v=__V__" defer></script>
  <script src="/assets/games.js?v=__V__" defer></script>
</head>
<body class="page-games">
  <div class="space space-static" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>

  <header class="topbar">
    <div class="wrap topbar-in">
      <a class="brand" href="/" aria-label="开桌 · 桌游社 首页">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="bm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22e5ff"/><stop offset="1" stop-color="#ff2bd6"/></linearGradient></defs><path d="M16 2l12 7v14l-12 7-12-7V9z" fill="none" stroke="url(#bm)" stroke-width="2.2" stroke-linejoin="round"/><circle cx="11.5" cy="12" r="2" fill="#22e5ff"/><circle cx="20.5" cy="20" r="2" fill="#ff2bd6"/><circle cx="16" cy="16" r="2" fill="#fff"/></svg>
        <span><span class="brand-name">开桌 · 桌游社</span><small>BOARD GAME CLUB</small></span>
      </a>
      <nav class="nav" aria-label="主导航">
        <a href="/" data-nav="/">首页</a>
        <a href="/games" data-nav="/games">游戏库</a>
        <a class="nav-cta" href="/signup" data-nav="/signup">报名</a>
        <a class="nav-admin" href="/admin" aria-label="管理后台" title="管理后台"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span>管理</span></a>
      </nav>
    </div>
  </header>

  <main id="main" class="wrap">
    <section class="lib-hero">
      <p class="kicker">// GAME LIBRARY</p>
      <h1>游戏库</h1>
      <p>每款都有介绍、规则速览和 B 站教学视频。先看两分钟视频，周五上桌更快。</p>
    </section>

    <div class="filters" role="search" aria-label="筛选游戏">
      <label class="search"><span class="sr-only">搜索游戏</span>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input class="input" id="q" type="search" placeholder="搜索游戏名、类型或关键词" autocomplete="off" enterkeyhint="search">
      </label>
      <div class="filter-row" id="fPlayers" aria-label="人数"><span>人数</span></div>
      <div class="filter-row" id="fTime" aria-label="时长"><span>时长</span></div>
      <div class="filter-row" id="fDiff" aria-label="难度"><span>难度</span></div>
      <div class="filter-row" id="fCat" aria-label="分类"><span>分类</span></div>
    </div>

    <p class="lib-count" id="count" aria-live="polite"></p>
    <div class="cards" id="list">
      <div class="skeleton" style="height:260px"></div>
      <div class="skeleton" style="height:260px"></div>
      <div class="skeleton" style="height:260px"></div>
    </div>
    <p class="lib-more">想玩的游戏不在这里？欢迎在群里推荐，社团会持续扩充游戏库。</p>
    <div style="height:48px"></div>
  </main>

  <footer class="footer">
    <div class="wrap footer-in">
      <span>© 2026 开桌 · 桌游社 · 每周五 18:30 · R312</span>
      <span><a href="/">首页</a> · <a href="/signup">报名</a> · <a href="/admin">管理</a></span>
    </div>
  </footer>
</body>
</html>
